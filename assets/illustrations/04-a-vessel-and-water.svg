<text x="320.0" y="568.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">水（実現手段）も当時のまま。</text>
<text x="320.0" y="590.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">過去の仮説を検証する。</text>
