<text x="880.0" y="568.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">水（実現手段）を現代のものに替える。</text>
<text x="880.0" y="590.0" fill="#232a33" font-size="16" text-anchor="middle" font-weight="400">過去の仮説から新しい仮説を生む。</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">水を替えると、検証する仮説が変わる。</text>
