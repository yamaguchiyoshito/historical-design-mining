<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">実現されなかった理由は、一つではない</title>
<desc id="desc">現代の技術で再検討できるものと、再実装しても残るものを分ける</desc>
<defs><marker id="arrow-2f8f83" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><marker id="arrow-c7792b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-8a4f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8a4f9e" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">HISTORICAL DESIGN MINING     01     図1-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">実現されなかった理由は、一つではない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">現代の技術で再検討できるものと、再実装しても残るものを分ける</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="400.0" y="196.0" width="400.0" height="60.0" rx="14" fill="#ffffff" stroke="#232a33" stroke-width="2"/>
<text x="600.0" y="234.0" fill="#232a33" font-size="22" text-anchor="middle" font-weight="700">実装されなかった構想</text>
<path d="M 600.0 256.0 L 600.0 286.0 L 220.0 286.0 L 220.0 316.0" fill="none" stroke="#2f8f83" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-2f8f83)"/>
<rect x="50.0" y="318.0" width="340.0" height="292.0" rx="16" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="220.0" y="358.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">現代の技術で再検討できる</text>
<text x="220.0" y="386.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">条件が変われば、試す余地がある</text>
<line x1="70.0" y1="404.0" x2="370.0" y2="404.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="78.0" cy="438.0" r="5" fill="#2f8f83"/>
<text x="96.0" y="444.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">計算資源の不足</text>
<circle cx="78.0" cy="498.0" r="5" fill="#2f8f83"/>
<text x="96.0" y="504.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">データの不足</text>
<path d="M 600.0 256.0 L 600.0 286.0 L 600.0 286.0 L 600.0 316.0" fill="none" stroke="#c7792b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-c7792b)"/>
<rect x="430.0" y="318.0" width="340.0" height="292.0" rx="16" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="600.0" y="358.0" fill="#c7792b" font-size="22" text-anchor="middle" font-weight="700">変わったかを個別に確認する</text>
<text x="600.0" y="386.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">現在の条件で解消したかを調べる</text>
<line x1="450.0" y1="404.0" x2="750.0" y2="404.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="458.0" cy="438.0" r="5" fill="#c7792b"/>
<text x="476.0" y="444.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">経済性</text>
<text x="476.0" y="468.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">製造や運用に見合わなかった</text>
<circle cx="458.0" cy="498.0" r="5" fill="#c7792b"/>
<text x="476.0" y="504.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">標準・制度・組織の慣行</text>
<text x="476.0" y="528.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">合わなかった</text>
<circle cx="458.0" cy="558.0" r="5" fill="#c7792b"/>
<text x="476.0" y="564.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">社会の需要</text>
<text x="476.0" y="588.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">まだ必要とされていなかった</text>
<path d="M 600.0 256.0 L 600.0 286.0 L 980.0 286.0 L 980.0 316.0" fill="none" stroke="#8a4f9e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-8a4f9e)"/>
<rect x="810.0" y="318.0" width="340.0" height="292.0" rx="16" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="980.0" y="358.0" fill="#8a4f9e" font-size="22" text-anchor="middle" font-weight="700">再実装でも同じ壁に当たる</text>
<text x="980.0" y="386.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">条件が変わっても残る</text>
<line x1="830.0" y1="404.0" x2="1130.0" y2="404.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="838.0" cy="438.0" r="5" fill="#8a4f9e"/>
<text x="856.0" y="444.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">原理的な限界</text>
<text x="856.0" y="468.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">実装を試みて初めてわかった</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">どの理由だったかで、再実装を試す意味が変わる。</text>
</g>
</svg>
