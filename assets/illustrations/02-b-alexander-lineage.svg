<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">アレグザンダーの初期の方法と後期の系譜</title>
<desc id="desc">初期の形式的な分割方法と、パターン・ランゲージを同一視しない</desc>
<defs><marker id="arrow-5d6873" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="770" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">HISTORICAL DESIGN MINING     02     図2-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">アレグザンダーの初期の方法と後期の系譜</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">初期の形式的な分割方法と、パターン・ランゲージを同一視しない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="50.0" y="190.0" width="26.0" height="16.0" rx="4" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="88.0" y="204.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">アレグザンダー本人の著作・記述</text>
<rect x="480.0" y="190.0" width="26.0" height="16.0" rx="4" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="518.0" y="204.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">後続の研究</text>
<rect x="50.0" y="224.0" width="1100.0" height="276.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2"/>
<text x="74.0" y="258.0" fill="#232a33" font-size="20" text-anchor="start" font-weight="700">初期の形式的な分割方法</text>
<line x1="90.0" y1="326.0" x2="1130.0" y2="326.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow-5d6873)"/>
<text x="160.0" y="306.0" fill="#2b5f9e" font-size="22" text-anchor="middle" font-weight="700">1962</text>
<circle cx="160.0" cy="326.0" r="8" fill="#2b5f9e"/>
<rect x="60.0" y="348.0" width="200.0" height="130.0" rx="12" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="74.0" y="376.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">博士論文が</text>
<text x="74.0" y="398.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">完成した</text>
<text x="74.0" y="420.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">（1964年の著作の</text>
<text x="74.0" y="442.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">もとになった）</text>
<text x="380.0" y="306.0" fill="#2b5f9e" font-size="22" text-anchor="middle" font-weight="700">1964</text>
<circle cx="380.0" cy="326.0" r="8" fill="#2b5f9e"/>
<rect x="280.0" y="348.0" width="200.0" height="130.0" rx="12" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="294.0" y="376.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">『Notes on the</text>
<text x="294.0" y="398.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">Synthesis of Form』</text>
<text x="294.0" y="420.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">を出版した</text>
<text x="600.0" y="306.0" fill="#2b5f9e" font-size="22" text-anchor="middle" font-weight="700">1965</text>
<circle cx="600.0" cy="326.0" r="8" fill="#2b5f9e"/>
<rect x="500.0" y="348.0" width="200.0" height="130.0" rx="12" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="514.0" y="376.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">「A City Is Not</text>
<text x="514.0" y="398.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">a Tree」を発表。</text>
<text x="514.0" y="420.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">木構造への分割を</text>
<text x="514.0" y="442.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">退けた*</text>
<text x="820.0" y="306.0" fill="#2b5f9e" font-size="22" text-anchor="middle" font-weight="700">1971</text>
<circle cx="820.0" cy="326.0" r="8" fill="#2b5f9e"/>
<rect x="720.0" y="348.0" width="200.0" height="130.0" rx="12" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="734.0" y="376.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">ペーパーバック版</text>
<text x="734.0" y="398.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">序文で、形式的で</text>
<text x="734.0" y="420.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">複雑な数学的方法は</text>
<text x="734.0" y="442.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">不要だったと述べた*</text>
<text x="1040.0" y="306.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">2023</text>
<circle cx="1040.0" cy="326.0" r="8" fill="#2f8f83"/>
<rect x="940.0" y="348.0" width="200.0" height="130.0" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="954.0" y="376.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">Gabrielの論考。</text>
<text x="954.0" y="398.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">村落の分解を計算</text>
<text x="954.0" y="420.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">機で再現しようと</text>
<text x="954.0" y="442.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">して、一致せず</text>
<line x1="922.0" y1="340.0" x2="938.0" y2="312.0" stroke="#5d6873" stroke-width="2"/>
<line x1="932.0" y1="340.0" x2="948.0" y2="312.0" stroke="#5d6873" stroke-width="2"/>
<text x="50.0" y="526.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">* 1965年と1971年の内容は、Gabriel（2023）の記述による。年表の間隔は等間隔ではない。</text>
<text x="600.0" y="580.0" fill="#c7792b" font-size="22" text-anchor="middle" font-weight="700">≠　同一視しない</text>
<rect x="50.0" y="604.0" width="1100.0" height="84.0" rx="16" fill="none" stroke="#5d6873" stroke-width="2" stroke-dasharray="8 7"/>
<text x="74.0" y="636.0" fill="#232a33" font-size="20" text-anchor="start" font-weight="700">後期のパターン・ランゲージ</text>
<text x="74.0" y="666.0" fill="#5d6873" font-size="17" text-anchor="start" font-weight="400">ソフトウェア分野で広く受け入れられた系譜。初期の形式的な分割方法とは別に扱う。</text>
<text x="50.0" y="742.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">同じ人の研究でも、時期と方法が違えば別のものとして扱う。</text>
</g>
</svg>
