<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">連載の見取り図</title>
<desc id="desc">なぜ、何を、どう発掘し、どう検証するか</desc>
<defs><marker id="arrow-2b5f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-5d6873" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">HISTORICAL DESIGN MINING     01     図1-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">連載の見取り図</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">なぜ、何を、どう発掘し、どう検証するか</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="50.0" y="210.0" width="245.0" height="290.0" rx="16" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="72.0" y="246.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="700">第1回</text>
<text x="72.0" y="292.0" fill="#2b5f9e" font-size="28" text-anchor="start" font-weight="700">なぜ</text>
<line x1="72.0" y1="312.0" x2="273.0" y2="312.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="72.0" y="346.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">過去の文章を設計書</text>
<text x="72.0" y="369.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">として読む仮説と、</text>
<text x="72.0" y="392.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">その限界を示す。</text>
<line x1="295.0" y1="355.0" x2="335.0" y2="355.0" stroke="#2b5f9e" stroke-width="2.5" marker-end="url(#arrow-2b5f9e)"/>
<rect x="335.0" y="210.0" width="245.0" height="290.0" rx="16" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="357.0" y="246.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="700">第2回</text>
<text x="357.0" y="292.0" fill="#2b5f9e" font-size="28" text-anchor="start" font-weight="700">何を</text>
<line x1="357.0" y1="312.0" x2="558.0" y2="312.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="357.0" y="346.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">エンゲルバートと</text>
<text x="357.0" y="369.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">アレグザンダーの原典</text>
<text x="357.0" y="392.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">から、実現された部分</text>
<text x="357.0" y="415.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">と残された部分を</text>
<text x="357.0" y="438.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">区別する。</text>
<line x1="580.0" y1="355.0" x2="620.0" y2="355.0" stroke="#2b5f9e" stroke-width="2.5" marker-end="url(#arrow-2b5f9e)"/>
<rect x="620.0" y="210.0" width="245.0" height="290.0" rx="16" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="642.0" y="246.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="700">第3回</text>
<text x="642.0" y="292.0" fill="#2b5f9e" font-size="28" text-anchor="start" font-weight="700">どう発掘する</text>
<line x1="642.0" y1="312.0" x2="843.0" y2="312.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="642.0" y="346.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">探索、継承調査、</text>
<text x="642.0" y="369.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">仕様化、評価の</text>
<text x="642.0" y="392.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">四工程を入力・出力・</text>
<text x="642.0" y="415.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">失敗条件つきで</text>
<text x="642.0" y="438.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">設計する。</text>
<rect x="642.0" y="456.0" width="71.0" height="28.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="677.5" y="475.2" fill="#c7792b" font-size="15" text-anchor="middle" font-weight="700">設計案</text>
<line x1="865.0" y1="355.0" x2="905.0" y2="355.0" stroke="#2b5f9e" stroke-width="2.5" marker-end="url(#arrow-2b5f9e)"/>
<rect x="905.0" y="210.0" width="245.0" height="290.0" rx="16" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="927.0" y="246.0" fill="#5d6873" font-size="16" text-anchor="start" font-weight="700">第4回</text>
<text x="927.0" y="292.0" fill="#2b5f9e" font-size="28" text-anchor="start" font-weight="700">どう検証する</text>
<line x1="927.0" y1="312.0" x2="1128.0" y2="312.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="927.0" y="346.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">忠実な再現と現代的</text>
<text x="927.0" y="369.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">拡張を区別し、比較</text>
<text x="927.0" y="392.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">実験の条件を示す。</text>
<rect x="927.0" y="456.0" width="161.0" height="28.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="1007.5" y="475.2" fill="#c7792b" font-size="15" text-anchor="middle" font-weight="700">実験計画（未実施）</text>
<path d="M 1027.0 500.0 L 1027.0 548.0 L 172.0 548.0 L 172.0 502.0" fill="none" stroke="#5d6873" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-5d6873)" stroke-dasharray="8 7"/>
<text x="600.0" y="536.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">第4回で、第1回の問いに戻る</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">各回は単独でも読めるが、問いは次の回へ手渡される。</text>
</g>
</svg>
